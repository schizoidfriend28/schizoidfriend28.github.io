<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marble Race 3D — Deterministic Physics Prototype</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #10131a;
        height: 100%;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        color: #e8e8e8;
        font: 13px/1.4 system-ui, sans-serif;
        background: rgba(0, 0, 0, 0.45);
        padding: 8px 12px;
        border-radius: 6px;
        pointer-events: none;
        white-space: pre;
        z-index: 10;
      }
      #restart {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 10;
        font: 13px/1.4 system-ui, sans-serif;
        color: #e8e8e8;
        background: rgba(30, 34, 44, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        padding: 8px 14px;
        cursor: pointer;
      }
      #restart:hover {
        background: rgba(50, 56, 70, 0.95);
      }
      #start-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 12, 17, 0.55);
      }
      #start-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        color: #e8e8e8;
        font: 14px/1.4 system-ui, sans-serif;
        background: rgba(30, 34, 44, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        padding: 28px 36px;
      }
      #start-seed {
        font-size: 15px;
        opacity: 0.85;
      }
      #start-status {
        font-size: 15px;
        font-weight: 600;
        color: #ff6b6b;
      }
      #start-status:empty {
        display: none;
      }
      #start-buttons {
        display: flex;
        gap: 12px;
      }
      #start-buttons button {
        font: 14px/1.4 system-ui, sans-serif;
        color: #e8e8e8;
        background: rgba(50, 56, 70, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 6px;
        padding: 10px 18px;
        cursor: pointer;
      }
      #start-buttons button:hover {
        background: rgba(70, 78, 96, 1);
      }
    </style>
    <script type="module" crossorigin src="./assets/index-OTep9j-M.js"></script>
  </head>
  <body>
    <div id="hud"></div>
    <button id="restart" title="Restart the race with the same seed" style="display: none">
      ⟳ Restart Race
    </button>
    <div id="start-overlay">
      <div id="start-panel">
        <div id="start-status"></div>
        <div id="start-seed"></div>
        <div id="start-buttons">
          <button id="play-same-seed">Play Same Seed</button>
          <button id="play-random-seed">Play Random Seed</button>
        </div>
      </div>
    </div>
    <canvas id="app"></canvas>
  </body>
</html>
